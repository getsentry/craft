name: AI summary integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.craft.yml'
      - '.github/workflows/ai-summary-check.yml'
      - '.github/workflows/release.yml'
      - 'action.yml'
      - 'src/utils/ai-provider.ts'
      - 'src/utils/ai-summary.ts'
      - 'src/utils/ai-summary-error.ts'
      - 'src/utils/changelog.ts'
      - 'src/schemas/project_config.ts'
      - 'src/__tests__/ai-summary-live.test.ts'
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.27.0
      - run: pnpm install --frozen-lockfile
      - name: Build CLI
        run: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ''
      - name: Replay full 2.35.1 summarizer
        run: pnpm test src/__tests__/ai-summary-live.test.ts
        env:
          CRAFT_TEST_LIVE_AI: 'true'
          GITHUB_TOKEN: ${{ github.token }}
          AI_SUMMARY_TOKEN: ${{ github.token }}
          CRAFT_AI_E2E_OUTPUT: ${{ runner.temp }}/craft-ai-summary-e2e
      - name: Upload public changelog replay results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-summary-release-replay
          path: ${{ runner.temp }}/craft-ai-summary-e2e
          if-no-files-found: ignore
