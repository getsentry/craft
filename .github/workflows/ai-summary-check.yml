name: AI summary integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ai-summary-check.yml'
      - '.github/workflows/release.yml'
      - 'action.yml'
      - 'src/utils/ai-provider.ts'
      - 'src/schemas/project_config.ts'
      - 'src/__tests__/ai-summary-live.test.ts'
      - 'src/__tests__/copilot-diagnostics.test.ts'
      - 'src/__tests__/helpers/copilot-diagnostics.ts'
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.27.0
      - run: pnpm install --frozen-lockfile
      - name: Inspect available Copilot model IDs
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://api.githubcopilot.com/models', {
            headers: {
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'Copilot-Integration-Id': 'copilot-developer-cli',
              'X-GitHub-Api-Version': '2026-07-01',
            },
            signal: AbortSignal.timeout(10000),
          });
          console.log(`Model catalog HTTP ${response.status}`);
          if (response.ok) {
            const catalog = await response.json();
            console.log(JSON.stringify((catalog.data || []).filter(model =>
              typeof model.id === 'string' && /^gpt-[a-z0-9._-]{1,100}$/.test(model.id)
            ).map(model => ({
              id: model.id,
              responses: model.supported_endpoints?.includes('/responses') ?? null,
              chat: model.supported_endpoints?.includes('/chat/completions') ?? null,
              policy: ['enabled', 'disabled', 'unconfigured'].includes(model.policy?.state) ? model.policy.state : null,
            }))));
          }
          NODE
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify real Copilot summary response
        run: pnpm test src/__tests__/ai-summary-live.test.ts
        env:
          CRAFT_TEST_LIVE_AI: 'true'
          GITHUB_TOKEN: ${{ github.token }}
