name: AI summary integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ai-summary-check.yml'
      - '.github/workflows/release.yml'
      - 'action.yml'
      - 'src/utils/ai-provider.ts'
      - 'src/schemas/project_config.ts'
      - 'src/__tests__/ai-summary-live.test.ts'
      - 'src/__tests__/copilot-diagnostics.test.ts'
      - 'src/__tests__/helpers/copilot-diagnostics.ts'
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.27.0
      - run: pnpm install --frozen-lockfile
      - name: Verify real Copilot summary response
        run: pnpm test src/__tests__/ai-summary-live.test.ts
        env:
          CRAFT_TEST_LIVE_AI: 'true'
          GITHUB_TOKEN: ${{ github.token }}
