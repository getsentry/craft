name: Build Craft for release
on:
  workflow_call:

# Keep the release build separate from build.yml's GHCR publishing jobs.
# External release callers must not need packages: write for skipped jobs.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
            name: Node 22
            tests: ''
          - os: ubuntu-latest
            node: '24'
            name: Node 24
            tests: ''
          - os: macos-latest
            node: '24'
            name: AI summary / macos-latest
            tests: src/__tests__/ai-summary.e2e.test.ts
          - os: windows-latest
            node: '24'
            name: AI summary / windows-latest
            tests: src/__tests__/ai-summary.e2e.test.ts
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '${{ matrix.node }}'
      - name: Get pnpm version from Volta config
        id: pnpm-version
        run: echo "version=$(jq -r '.volta.pnpm' package.json)" >> $GITHUB_OUTPUT
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
      # Install fresh on Windows instead of restoring archived pnpm junctions.
      - uses: actions/cache@v5
        if: runner.os != 'Windows'
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test ${{ matrix.tests }}

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ github.ref == 'refs/heads/master' && 'production' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Get pnpm version from Volta config
        id: pnpm-version
        run: echo "version=$(jq -r '.volta.pnpm' package.json)" >> $GITHUB_OUTPUT
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
      - uses: actions/cache@v5
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          CRAFT_BUILD_SHA: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm build
      - name: Smoke Test
        run: ./dist/craft --help
      - name: NPM Pack
        run: npm pack
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: craft-binary
          path: |
            ${{ github.workspace }}/*.tgz
            ${{ github.workspace }}/dist/craft

  docs:
    name: Build Docs
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Get pnpm version from Volta config
        id: pnpm-version
        run: echo "version=$(jq -r '.volta.pnpm' package.json)" >> $GITHUB_OUTPUT
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
      - name: Build Docs
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Package Docs
        run: |
          cp .nojekyll docs/dist/
          cd docs/dist && zip -r ../../gh-pages.zip .
      - name: Upload Docs Artifact
        uses: actions/upload-artifact@v7
        with:
          name: craft-docs
          path: ${{ github.workspace }}/gh-pages.zip
