name: Native binaries
on:
  pull_request:
  push:
    branches: [master, release/**]
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: Native / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: windows-2025
            platform: win-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.27.0
      - uses: actions/cache@v5
        with:
          path: .node-cache
          key: node-sea-${{ matrix.platform }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Build standalone executable and npm bundle
        env:
          CRAFT_BUILD_SHA: ${{ github.sha }}
        run: pnpm build:binary ${{ matrix.platform }}
      - name: Pack and test shipped artifacts
        run: |
          pnpm pack --pack-destination packed
          node .github/scripts/native-smoke.mjs packed/sentry-craft-$(node -p "require('./package.json').version").tgz
      - name: Upload standalone release files
        uses: actions/upload-artifact@v7
        with:
          name: craft-native-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist-bin/*.gz
            dist-bin/*.exe
            dist-bin/*.sha256
