minVersion: '2.14.0'
changelog:
  policy: auto
artifactProvider:
  name: github
  config:
    artifacts:
      Build & Test:
        - craft-binary
        - craft-docs
        - craft-native
preReleaseCommand: >-
  node -p "
    const {execSync} = require('child_process');
    execSync('npm --no-git-tag-version version ' + process.env.CRAFT_NEW_VERSION).toString();
  "
postReleaseCommand: >-
  node -p "
    const {execSync} = require('child_process');
    execSync('npm --no-git-tag-version version preminor --preid=dev');
    execSync('git diff --quiet || git commit -anm \'meta: Bump new development version\\n\\n#skip-changelog\' && git pull --rebase && git push').toString();"
requireNames:
  - /^sentry-craft.*\.tgz$/
  - /^craft$/
  - /^craft-install$/
  - /^craft-darwin-arm64\.gz$/
  - /^craft-darwin-arm64\.gz\.sha256$/
  - /^craft-darwin-x64\.gz$/
  - /^craft-darwin-x64\.gz\.sha256$/
  - /^craft-linux-arm64\.gz$/
  - /^craft-linux-arm64\.gz\.sha256$/
  - /^craft-linux-x64\.gz$/
  - /^craft-linux-x64\.gz\.sha256$/
  - /^craft-win-x64\.exe$/
  - /^craft-win-x64\.exe\.sha256$/
  - /^craft-darwin-arm64$/
  - /^craft-darwin-x64$/
  - /^craft-linux-arm64$/
  - /^craft-linux-x64$/
  - /^craft-win-x64\.exe\.gz$/
targets:
  - name: npm
    includeNames: /^sentry-craft-[0-9].*\.tgz$/
  - name: gcs
    includeNames: /^(?:.*craft.*|gh-pages\.zip)$/
    bucket: sentry-sdk-assets
    paths:
      - path: /craft/{{version}}/
        metadata:
          cacheControl: 'public, max-age=2592000'
      - path: /craft/latest/
        metadata:
          cacheControl: 'public, max-age=300'
  - name: registry
    apps:
      'app:craft':
        urlTemplate: 'https://downloads.sentry-cdn.com/craft/{{version}}/{{file}}'
        checksums:
          - algorithm: sha256
            format: hex
  - id: release
    name: docker
    source: ghcr.io/getsentry/craft
    target: getsentry/craft
  - id: latest
    name: docker
    source: ghcr.io/getsentry/craft
    target: getsentry/craft
    targetFormat: '{{{target}}}:latest'
  - name: github
    floatingTags:
      - 'v{major}'
  - name: brew
    tap: getsentry/tools
    formula: craft
    path: Formula
    includeNames: /^craft-(darwin|linux)-(arm64|x64)\.gz$/
    template: |
      class Craft < Formula
        desc "Universal release tool"
        homepage "https://craft.sentry.dev"
        version "{{version}}"
        license "MIT"
        depends_on "git"

        if OS.mac?
          if Hardware::CPU.arm?
            url "https://github.com/getsentry/craft/releases/download/{{version}}/craft-darwin-arm64.gz"
            sha256 "{{checksums.craft-darwin-arm64__gz}}"
          elsif Hardware::CPU.intel?
            url "https://github.com/getsentry/craft/releases/download/{{version}}/craft-darwin-x64.gz"
            sha256 "{{checksums.craft-darwin-x64__gz}}"
          else
            raise "Unsupported macOS CPU architecture"
          end
        elsif OS.linux?
          if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
            url "https://github.com/getsentry/craft/releases/download/{{version}}/craft-linux-arm64.gz"
            sha256 "{{checksums.craft-linux-arm64__gz}}"
          elsif Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
            url "https://github.com/getsentry/craft/releases/download/{{version}}/craft-linux-x64.gz"
            sha256 "{{checksums.craft-linux-x64__gz}}"
          else
            raise "Unsupported Linux CPU architecture"
          end
        else
          raise "Unsupported operating system"
        end

        def install
          bin.install Dir["craft-*"].first => "craft"
        end

        test do
          assert_match version.to_s, shell_output("#{bin}/craft --version").chomp
        end
      end
  - name: gh-pages
